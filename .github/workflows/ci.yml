name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm test
  # The Android app: the web files built in with three.js and the fonts (tools/build-app.js), synced into the Capacitor
  # project and built as a debug APK, kept as this run's artifact "ayo-ncho-android-debug" (install it on a phone to try).
  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci || npm install
      - run: node tools/build-app.js
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ayo-ncho-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
