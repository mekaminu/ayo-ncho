services:
  - type: web
    name: ayo-ncho
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev # the server needs express and ws only; the app tooling stays out
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ROOM_SECRET # seals online rooms so a game survives a restart or deploy; Render makes it once (free, no plan change)
        generateValue: true
